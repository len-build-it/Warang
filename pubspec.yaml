name: warang
description: "An offline-first map of your own photographs."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.1
  flutter_riverpod: ^3.0.0
  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  image: ^4.9.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.2+1
  sqlite3_flutter_libs: ^0.5.32
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.28.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    - design/warang-maya.png
    - assets/data/news_items.json
    - assets/data/maya_lines.json
    - assets/maya/body.png
    - assets/fonts/BagelFatOne-OFL.txt
    - assets/fonts/AtkinsonHyperlegibleNext-OFL.txt
    - assets/fonts/ShantellSans-OFL.txt
  fonts:
    - family: Bagel Fat One
      fonts:
        - asset: assets/fonts/BagelFatOne-Regular.ttf
          weight: 400
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: Shantell Sans
      fonts:
        - asset: assets/fonts/ShantellSans-Medium.ttf
          weight: 500
    - family: WarangIcons
      fonts:
        - asset: assets/fonts/WarangIcons.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: design/warang-maya.png
  adaptive_icon_background: "#E8A020"
  adaptive_icon_foreground: design/warang-maya-foreground.png
  adaptive_icon_monochrome: design/warang-maya-monochrome.png
  min_sdk_android: 21
