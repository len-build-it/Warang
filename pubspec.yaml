name: warang
description: "An offline-first map of your own photographs."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  cupertino_icons: ^1.0.8
  cross_file: ^0.3.5+4
  drift: ^2.28.1
  flutter_riverpod: ^3.0.0
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  share_plus: ^13.3.0
  sqlite3_flutter_libs: ^0.5.32
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - design/warang-maya.png
